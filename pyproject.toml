[project]
name = "medical-rag-assistant"
version = "0.1.0"
description = "LLM + RAG medical Q&A and symptom-exploration assistant (Ollama, FAISS, MedQuAD)."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # pyflakes + core pycodestyle
