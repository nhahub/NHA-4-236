name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch/torchvision (avoids the large CUDA wheels) — the MRI
          # backbone and the imaging tests need it.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements/base.txt
          pip install ruff

      - name: Lint
        run: ruff check .

      - name: Unit tests (offline — Ragas/Ollama-dependent tests auto-skip)
        run: pytest -q
