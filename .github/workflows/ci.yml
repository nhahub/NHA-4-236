name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint + test deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio
          # Lightweight runtime deps needed for the offline unit tests.
          pip install fastapi "uvicorn[standard]" httpx pydantic pydantic-settings \
                      rank-bm25 numpy tqdm

      - name: Lint
        run: ruff check .

      - name: Unit tests (offline — heavy ML deps + Ragas skipped)
        run: pytest tests/test_rag_retrieval.py tests/test_safety.py tests/test_api.py -q
